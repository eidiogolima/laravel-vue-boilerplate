name: Bug report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. For security vulnerabilities, please use private reporting instead (see the Security Policy).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See the error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Relevant error output, stack traces or screenshots. Remove any sensitive data.
  - type: input
    id: php
    attributes:
      label: PHP version
      placeholder: "8.5.0"
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "22.0.0"
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Local (composer dev)
        - Docker
        - Production
        - CI
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and could not find a duplicate.
          required: true
